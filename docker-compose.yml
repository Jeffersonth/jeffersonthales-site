# Projeto "jeffersonthales-site" no Docker Manager da VPS (Hostinger).
# Usa a imagem oficial php:8.3-apache; ao iniciar, o contêiner baixa a versão mais recente
# deste repositório (deploy/start.sh). Para atualizar o site: push no GitHub + reiniciar o projeto.
services:
  web:
    image: php:8.3-apache
    container_name: jeffersonthales-site
    restart: unless-stopped
    command: ["sh", "-c", "curl -fsSL https://raw.githubusercontent.com/Jeffersonth/jeffersonthales-site/main/deploy/start.sh | sh"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    labels:
      - traefik.enable=true
      - traefik.http.routers.jeffersonthales.rule=Host(`jeffersonthales.com`) || Host(`www.jeffersonthales.com`)
      - traefik.http.routers.jeffersonthales.entrypoints=websecure
      - traefik.http.routers.jeffersonthales.tls.certresolver=letsencrypt
      - traefik.http.services.jeffersonthales.loadbalancer.server.port=80
